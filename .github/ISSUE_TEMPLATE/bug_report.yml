name: Bug Report
description: Report an issue, routing failure, or unexpected error in email-router-api
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.
        If this is an email relay vulnerability or security issue, please do NOT use this form; refer to [SECURITY.md](https://github.com/itsgoharrehman/email-router-api/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact HTTP request payload sent.
      placeholder: |
        1. Send POST request with payload
        2. Observe response code
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Wrangler version, Cloudflare compatibility date.
      placeholder: |
        - Wrangler Version: 3.x
        - Compatibility Date: 2024-03-03
    validations:
      required: true